# Khung cấu hình — CHƯA CÓ GIÁ TRỊ.
# Mọi giá trị để null cho tới khi spec tương ứng được duyệt; D-xx chưa chốt thì không điền mặc định.
# Tên khoá bám ký hiệu trong references/model-design.md và có thể đổi khi spec chốt (spec là chuẩn).
# Config đã gộp của mỗi lần chạy được ghi ra runs/<id>/config.yaml.

seed: 42

paths:
  raw: data/raw/cert-r4.2
  interim: data/interim
  processed: data/processed
  runs: runs
  reports: reports

data:
  cert_version: r4.2
  chunk_rows: 250000
  datetime_format: "%m/%d/%Y %H:%M:%S"
  work_hours: ["07:00", "19:00"]
  user_buckets: 64
  source_priority: [logon, device, file, http, email]

split:                # C1
  scheme: chronological_ratio
  ratios: [0.60, 0.15, 0.25]
  malicious_in_train: keep

features:
  count: 100
  pc_history_days: 30
  own_pc_min_days: 3
  history_days: 30
  psychometric_mode: ablation_only
  transform: raw

sequence:
  max_len: null
  truncation: compress_only
  run_gap_minutes: 5
  gap_bucket_minutes: [0, 1, 5, 15, 60, 240]

feature_ae:           # C2 — khoảng tune ở tuning-protocol.md §3
  latent: 32
  hidden: [128, 64]
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.00001
  batch_size: 512
  max_epochs: 200
  patience: 10

seq_transformer:      # C3
  objective: reconstruction
  d_model: 64
  tcn_dilations: [1, 2, 4]
  n_layers: 2
  n_heads: 4
  ff_mult: 2
  dropout: 0.1
  lr: 0.0005
  weight_decay: 0.00001
  batch_size: 32
  effective_batch_size: 128
  max_epochs: 200
  patience: 7

fusion:               # C4
  alpha: 0.5

tiers:                # C5
  placement: null     # D-08
  group_key: null     # D-07
  weighting: null     # D-09
  W: null             # D-11
  k_P: null
  k_G: null
  min_group_size: null

threshold:            # C6
  p_selection: null   # D-10
  budget_B: null
  p: null
  R: null             # D-11
  W_tau: null

evaluation:           # C7
  n_seeds: null
  recall_at_k: null
  bootstrap_n: null

tuning:
  n_trials: null
  user_subsample: null
